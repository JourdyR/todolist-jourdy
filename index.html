<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOF TO-DO: ROUND 1!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background: #0a0a0a;
            color: #fff;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-attachment: fixed;
        }
        .kof-border {
            border: 4px solid #ff4500;
            box-shadow: 5px 5px 0px #8b0000;
        }
        .kof-btn {
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .kof-btn:hover {
            transform: scale(1.05);
            background-color: #ff4500 !important;
        }
        .kof-card {
            background: rgba(20, 20, 20, 0.9);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="login-page" class="w-full max-auto max-w-md kof-card kof-border p-8 text-center">
        <h1 class="text-2xl mb-8 text-yellow-500 italic">SELECT YOUR CHARACTER</h1>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="USERNAME" class="w-full p-3 bg-black border-2 border-gray-700 focus:border-red-500 outline-none text-xs">
            <input type="password" id="password" placeholder="PASSWORD" class="w-full p-3 bg-black border-2 border-gray-700 focus:border-red-500 outline-none text-xs">
            <button onclick="handleLogin()" class="w-full bg-red-700 p-4 kof-btn text-sm">INSERT COIN (LOGIN)</button>
        </div>
        <p id="login-error" class="text-red-500 text-[10px] mt-4 hidden">INVALID COMMAND! TRY AGAIN.</p>
    </div>

    <div id="main-page" class="w-full max-w-4xl kof-card kof-border p-6 hidden">
        <div class="flex justify-between items-center border-b-4 border-red-700 pb-4 mb-6">
            <div>
                <p class="text-[10px] text-gray-400">PLAYER 1:</p>
                <h2 id="display-name" class="text-xl text-yellow-400">---</h2>
            </div>
            <button onclick="handleLogout()" class="bg-gray-800 px-4 py-2 text-[10px] kof-btn">LOGOUT</button>
        </div>

        <div id="admin-controls" class="hidden mb-8">
            <h3 class="text-xs mb-4 text-blue-400">ADD NEW COMBO (TASK):</h3>
            <div class="flex gap-2">
                <input type="text" id="task-input" placeholder="What's the mission?" class="flex-1 p-3 bg-black border-2 border-gray-700 text-[10px] outline-none">
                <button onclick="addTask()" class="bg-blue-700 px-6 kof-btn text-[10px]">ADD</button>
            </div>
        </div>

        <div>
            <h3 class="text-xs mb-4 text-red-500">MISSION LIST:</h3>
            <div id="task-list" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        // Database Sederhana
        const users = [
            { username: "admin", pass: "123", name: "Jourdy Nichol", role: "admin" },
            { username: "user1", pass: "12345", name: "User", role: "viewer" }
        ];

        let currentUser = null;
        let tasks = JSON.parse(localStorage.getItem('kof_tasks')) || [
            { id: 1, text: "Kalahkan Rugal Bernstein", status: "pending" }
        ];

        // Login Logic
        function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const error = document.getElementById('login-error');

            const found = users.find(user => user.username === u && user.pass === p);

            if (found) {
                currentUser = found;
                showDashboard();
            } else {
                error.classList.remove('hidden');
            }
        }

        // Tampilan Dashboard
        function showDashboard() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
            document.getElementById('display-name').innerText = currentUser.name;

            if (currentUser.role === 'admin') {
                document.getElementById('admin-controls').classList.remove('hidden');
            }

            renderTasks();
        }

        // Render Task ke Layar
        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';

            tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-900 p-4 border-l-4 border-yellow-500";
                
                let actionBtn = '';
                if (currentUser.role === 'admin') {
                    actionBtn = `<button onclick="deleteTask(${index})" class="text-red-500 hover:text-white text-[10px]">[DELETE]</button>`;
                }

                div.innerHTML = `
                    <span class="text-[10px]">${index + 1}. ${task.text}</span>
                    ${actionBtn}
                `;
                list.appendChild(div);
            });
        }

        // Tambah Task (Admin Only)
        function addTask() {
            const input = document.getElementById('task-input');
            if (input.value.trim() === '') return;

            tasks.push({ id: Date.now(), text: input.value, status: "pending" });
            saveAndRefresh();
            input.value = '';
        }

        // Hapus Task (Admin Only)
        function deleteTask(index) {
            tasks.splice(index, 1);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('kof_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function handleLogout() {
            location.reload(); // Gampangannya tinggal refresh buat logout
        }
    </script>
</body>
</html>
